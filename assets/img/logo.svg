<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f5ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff00ff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon/Logo Symbol -->
  <g filter="url(#glow)">
    <!-- Hexagon shape -->
    <polygon points="30,5 50,15 50,35 30,45 10,35 10,15" fill="none" stroke="url(#logoGradient)" stroke-width="2"/>
    
    <!-- Inner tech elements -->
    <line x1="30" y1="15" x2="30" y2="35" stroke="url(#logoGradient)" stroke-width="2"/>
    <line x1="15" y1="25" x2="45" y2="25" stroke="url(#logoGradient)" stroke-width="2"/>
    
    <!-- Corner accents -->
    <circle cx="10" cy="15" r="2" fill="#00f5ff"/>
    <circle cx="50" cy="15" r="2" fill="#00f5ff"/>
    <circle cx="10" cy="35" r="2" fill="#ff00ff"/>
    <circle cx="50" cy="35" r="2" fill="#ff00ff"/>
    
    <!-- Center dot -->
    <circle cx="30" cy="25" r="3" fill="url(#logoGradient)"/>
  </g>
  
  <!-- Text -->
  <text x="60" y="38" font-family="Arial, sans-serif" font-weight="900" font-size="24" fill="url(#logoGradient)" filter="url(#glow)">
    DEVCLUB
  </text>
</svg>
